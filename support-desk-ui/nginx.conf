server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # React/Vite frontend calls /api/* with fetch().
    # In Compose, "backend" will be the Spring Boot service name (set up in Exercise 3).
    # Use Docker's embedded DNS resolver + a variable so nginx re-resolves "backend"
    # instead of caching a stale IP if the backend container restarts.
    resolver 127.0.0.11 valid=10s;
    set $backend_upstream http://backend:8080;

    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # React Router fallback: /login, /app/tickets, /app/reports should all load index.html,
    # letting React Router's client-side routing take over instead of Nginx 404ing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}